<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">canteen-connect architecture</title>
  <desc id="d">A React app talks to a GraphQL API backed by MongoDB. Order events are saved with an outbox, published to RabbitMQ, and consumed by an AI feedback triage worker. A scheduled job writes daily summaries. Everything runs on Azure Container Apps with Grafana for observability.</desc>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#4B5563"/></marker>
    <marker id="arrd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E8B57"/></marker>
    <marker id="arre" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#7C3AED"/></marker>
  </defs>

  <rect width="1180" height="800" fill="#FFFFFF"/>

  <text x="40" y="38" font-size="22" font-weight="700" fill="#111827">canteen-connect</text>
  <text x="40" y="58" font-size="13" fill="#4B5563">Architecture: company canteen ordering with a built-in Feedback Hub</text>

  <!-- Lane 1: request path -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <rect x="40" y="90" width="210" height="90" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="145" y="118" font-weight="700">React + TypeScript app</text>
    <text x="145" y="138" font-size="11" fill="#4B5563">Employee view · Canteen view</text>
    <text x="145" y="154" font-size="11" fill="#4B5563">Feedback widget</text>

    <rect x="380" y="90" width="250" height="90" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="505" y="118" font-weight="700">GraphQL API</text>
    <text x="505" y="138" font-size="11" fill="#4B5563">Node.js + TypeScript</text>
    <text x="505" y="154" font-size="11" fill="#4B5563">queries · mutations · subscriptions</text>
    <text x="505" y="170" font-size="11" fill="#4B5563">JWT auth · roles</text>
  </g>
  <g stroke="#4B5563" stroke-width="1.8" fill="none">
    <path d="M250 117 H378" marker-end="url(#arr)"/>
    <path d="M378 153 H252" marker-end="url(#arr)"/>
  </g>
  <text x="314" y="111" font-size="11" text-anchor="middle" fill="#4B5563">query, mutate</text>
  <text x="314" y="170" font-size="11" text-anchor="middle" fill="#4B5563">live updates</text>

  <!-- Order journey legend -->
  <g font-size="12" fill="#374151">
    <text x="700" y="100" font-weight="700" fill="#111827">Order journey</text>
    <text x="700" y="120">1  Employee places an order</text>
    <text x="700" y="138">2  Order and its event saved together</text>
    <text x="700" y="156">3  Relay publishes the event</text>
    <text x="700" y="174">4  Status reaches the app live</text>
    <text x="700" y="192">5  Feedback goes to the triage agent</text>
  </g>

  <!-- MongoDB band -->
  <rect x="30" y="240" width="1120" height="100" rx="12" fill="#EAF7EE" stroke="#2E8B57" stroke-width="1.8"/>
  <text x="48" y="266" font-size="14" font-weight="700" fill="#1D5E3A">MongoDB</text>
  <text x="48" y="285" font-size="11" fill="#1D5E3A">replica set, so an order and its</text>
  <text x="48" y="299" font-size="11" fill="#1D5E3A">outbox event commit in one transaction</text>
  <text x="48" y="321" font-size="11" fill="#1D5E3A">also read and written by the workers</text>
  <g font-size="12" text-anchor="middle" fill="#111827">
    <rect x="465" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/><text x="510" y="300" font-weight="600">users</text>
    <rect x="563" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/><text x="608" y="300" font-weight="600">menuItems</text>
    <rect x="661" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/><text x="706" y="300" font-weight="600">dailyStock</text>
    <rect x="759" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/><text x="804" y="300" font-weight="600">orders</text>
    <rect x="857" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/><text x="902" y="300" font-weight="600">feedback</text>
    <rect x="955" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/><text x="1000" y="300" font-weight="600">outbox</text>
    <rect x="1053" y="277" width="90" height="36" rx="6" fill="#FFFFFF" stroke="#2E8B57" stroke-width="1.4"/><text x="1098" y="300" font-weight="600">summaries</text>
  </g>

  <!-- API to Mongo -->
  <path d="M560 180 V238" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)" marker-start="url(#arrd)"/>
  <text x="572" y="214" font-size="11" fill="#1D5E3A">read / write</text>

  <!-- Lane 3: event path -->
  <g font-size="13" text-anchor="middle" fill="#111827">
    <rect x="40" y="400" width="200" height="80" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="140" y="432" font-weight="700">Outbox relay</text>
    <text x="140" y="452" font-size="11" fill="#4B5563">publishes saved events</text>

    <rect x="310" y="390" width="220" height="100" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.8"/>
    <text x="420" y="418" font-weight="700">RabbitMQ</text>
    <text x="420" y="438" font-size="11" fill="#4B5563">exchange: canteen.events</text>
    <text x="420" y="454" font-size="11" fill="#4B5563">queues: feedback.triage · projections</text>
    <text x="420" y="470" font-size="11" fill="#4B5563">dead-letter queue for failures</text>

    <rect x="620" y="380" width="230" height="90" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="735" y="408" font-weight="700">Feedback triage worker</text>
    <text x="735" y="428" font-size="11" fill="#4B5563">AI agent: classify · prioritise · summarise</text>
    <text x="735" y="444" font-size="11" fill="#4B5563">emits FeedbackTriaged</text>

    <rect x="620" y="520" width="230" height="90" rx="10" fill="#EEF3FF" stroke="#3B6FE0" stroke-width="1.8"/>
    <text x="735" y="548" font-weight="700">Daily summary job</text>
    <text x="735" y="568" font-size="11" fill="#4B5563">scheduled (cron) · AI agent</text>
    <text x="735" y="584" font-size="11" fill="#4B5563">popular dishes, top complaints</text>

    <rect x="930" y="420" width="210" height="140" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1035" y="458" font-weight="700">LLM API (external)</text>
    <text x="1035" y="480" font-size="11" fill="#4B5563">returns structured JSON</text>
    <text x="1035" y="498" font-size="11" fill="#4B5563">output is a suggestion;</text>
    <text x="1035" y="514" font-size="11" fill="#4B5563">a person approves replies</text>

    <rect x="310" y="560" width="220" height="80" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="420" y="590" font-weight="700">Reporting projector</text>
    <text x="420" y="610" font-size="11" fill="#4B5563">optional: builds a read model</text>
    <text x="420" y="626" font-size="11" fill="#4B5563">from events</text>

    <rect x="40" y="560" width="200" height="80" rx="10" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="140" y="590" font-weight="700">PostgreSQL</text>
    <text x="140" y="610" font-size="11" fill="#4B5563">optional: reporting tables</text>
    <text x="140" y="626" font-size="11" fill="#4B5563">and dashboard queries</text>
  </g>

  <!-- relay <-> Mongo -->
  <path d="M140 400 V342" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrd)" marker-start="url(#arrd)"/>
  <text x="152" y="376" font-size="11" fill="#1D5E3A">reads outbox</text>

  <!-- relay -> broker -->
  <path d="M240 440 H308" stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#arre)"/>
  <text x="274" y="432" font-size="11" text-anchor="middle" fill="#5B21B6">publish</text>

  <!-- broker -> API (status events) -->
  <path d="M400 390 V182" stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#arre)"/>
  <text x="408" y="375" font-size="11" fill="#5B21B6">status events</text>

  <!-- broker -> triage -->
  <path d="M530 425 H618" stroke="#7C3AED" stroke-width="1.8" fill="none" marker-end="url(#arre)"/>

  <!-- broker -> projector -->
  <path d="M420 490 V558" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arre)"/>
  <!-- projector -> postgres -->
  <path d="M310 600 H242" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>

  <!-- workers <-> LLM -->
  <path d="M850 425 L928 450" stroke="#4B5563" stroke-width="1.6" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M850 565 L928 535" stroke="#4B5563" stroke-width="1.6" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- step badges -->
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="258" cy="96" r="10" fill="#3B6FE0"/><text x="258" y="100">1</text>
    <circle cx="542" cy="205" r="10" fill="#2E8B57"/><text x="542" y="209">2</text>
    <circle cx="274" cy="416" r="10" fill="#7C3AED"/><text x="274" y="420">3</text>
    <circle cx="400" cy="300" r="10" fill="#7C3AED"/><text x="400" y="304">4</text>
    <circle cx="574" cy="408" r="10" fill="#7C3AED"/><text x="574" y="412">5</text>
  </g>

  <!-- Bottom: delivery + observability -->
  <g font-size="13" fill="#111827">
    <rect x="40" y="680" width="520" height="80" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/>
    <text x="56" y="705" font-weight="700">CI/CD: GitHub Actions</text>
    <text x="56" y="725" font-size="12" fill="#4B5563">lint · test · build images → Azure Container Registry</text>
    <text x="56" y="743" font-size="12" fill="#4B5563">→ deploy to Azure Container Apps (infrastructure as code with Bicep)</text>

    <rect x="600" y="680" width="540" height="80" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6"/>
    <text x="616" y="705" font-weight="700">Observability: OpenTelemetry → Prometheus → Grafana</text>
    <text x="616" y="725" font-size="12" fill="#4B5563">orders per hour · preparation time · sold-out items</text>
    <text x="616" y="743" font-size="12" fill="#4B5563">queue depth · triage latency · feedback sentiment</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#4B5563">
    <line x1="40" y1="786" x2="76" y2="786" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arr)"/><text x="84" y="790">request / call</text>
    <line x1="210" y1="786" x2="246" y2="786" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arre)"/><text x="254" y="790">event</text>
    <line x1="330" y1="786" x2="366" y2="786" stroke="#2E8B57" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrd)"/><text x="374" y="790">database access</text>
    <rect x="510" y="777" width="30" height="16" rx="4" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3"/><text x="548" y="790">external or optional</text>
  </g>
</svg>
